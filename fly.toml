# ORCMM — backend en Fly.io
#
# UNA SOLA MÁQUINA, a propósito. El servicio guarda el resultado de cada
# análisis en un directorio temporal y su índice en memoria del proceso. Con
# dos máquinas, la petición de descarga puede caer en la que no corrió el
# análisis y responder 404. Mientras el estado no salga del proceso, esto no
# se escala en horizontal.
#
#   auto_stop_machines = 'off'  para que un análisis recién hecho siga
#                               disponible para descargar aunque nadie más
#                               toque la API en ese rato.
#
# Ojo: min_machines_running NO impide que Fly cree dos máquinas al desplegar.
# Eso se pide con `fly deploy --ha=false`.
#
# Región dfw (Dallas): qro (Querétaro) quedó obsoleta y ya no admite recursos
# nuevos. Dallas es de las más cercanas a México de las que siguen vivas.

app = 'orc-api'
primary_region = 'dfw'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  interval = '30s'
  timeout = '5s'
  grace_period = '10s'
  method = 'GET'
  path = '/api/salud'

# 2 GB medidos, no elegidos al tanteo. El layout V5 con sus CSV deja el
# proceso en 843 MB de pico: 400 MB después de leer las fuentes (430 mil
# registros entre OSA, pedidos y citas) y el resto al construir el Excel de
# salida, que openpyxl arma entero en memoria antes de guardarlo. Con los
# 512 MB anteriores la máquina moría a mitad del análisis.
#
# El margen extra es para orcmm_corregir_layout: abre DOS workbooks en modo
# normal (uno con fórmulas y otro con valores) y ahí no se puede usar
# read_only, porque hay que reescribir el archivo.
#
# La API corre un solo análisis a la vez (ThreadPoolExecutor de 1 worker en
# api/main.py) justamente para que este pico no se multiplique.
[[vm]]
  size = 'shared-cpu-2x'
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 2
